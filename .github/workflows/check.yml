# The gates, run where the repository can state their result.
#
# The Justfile's `check` recipe is the definition of green, and this
# workflow's job is to run it, not to restate it. That is why the gates
# are one step rather than one each: splitting them would buy per-gate
# timing in the run summary and pay for it with a copy of `check`'s
# composition living here, where a recipe added to `check` later would
# silently not be picked up. `just` names the recipe that failed in its own
# error line, so a failing gate is still identifiable without the split.
#
# Recipes are named here rather than cited by line. Every line number
# this file used to carry had drifted off its target by the time anyone
# followed it — `Justfile:279`, offered as the definition of green,
# landed inside a UI recipe — and a reference that silently rots is
# worse than the paragraph it was meant to shorten.
#
# What this does **not** cover, stated here rather than left to be inferred
# from its absence:
#
#   - `just ui-e2e` builds a second Tauri binary with the
#     `wdio` feature and drives a real window. It is out of `check` for that
#     reason and out of here until someone has established that a hosted
#     runner can give it a window and that the minutes are worth it. Until
#     then the drag surface and the sidebar markup are covered locally or
#     not at all.
#   - `just collation-jsc` runs the collation corpus
#     through JavaScriptCore. It exits 0 with a skip notice where `jsc` is
#     missing, so on any runner but macOS it would contribute a green step
#     that checked nothing. Run it locally when sort order or the corpus
#     changes.

name: check

# The ignore list is what a change can touch without changing what
# `just check` would answer. A pull request that edits only these gets no
# run at all, which is the point: #57 changed eighteen lines across
# `CONTRIBUTING.md`, `CHANGELOG.md` and the pointer memory, and bought
# a workspace test suite, a clippy pass over every crate and a rustdoc
# pass over all of them — 710 s of macOS runner, plus a second run of
# the same on `main` behind the merge. Nothing in it could have had
# anything to say about the prose that triggered it.
#
# This narrows CI and does not make `pre-push` and CI agree. On a
# prose-only branch `pre-push` still runs `check-shared` — formatting,
# the bindings check, the three frontend recipes, `aidoc-guard` — and
# the two `-changed` gates, which report that no workspace member moved.
# CI will now run none of that. What the two agree about is the
# workspace suite: neither pays for it to answer a question about prose.
#
# `paths-ignore` skips only when *every* changed path matches, so a
# branch that touches a crate and the changelog still runs in full. That
# is the property this relies on — the list does not have to be a
# judgement about which mixed changes are safe, because there are none.
#
# Deliberately absent, each for its own reason:
#
#   - `.github/**`. A change to this workflow has to be answered by this
#     workflow; a filter that skipped it would be the one edit nobody
#     could verify.
#   - `Justfile`. It *is* the definition of green.
#   - `docs/aidoc/**`. Generated, but `aidoc-guard` checks it, and a
#     hand-edit there is exactly what that gate exists to catch.
#   - `.gitignore`. It decides what is tracked, and both `aidoc-guard`
#     and the `git add -A docs/aidoc` step below read tracked state.
#   - `fixtures/**`. The collation corpus lives there, README included —
#     and `README.md` on the list reaches only the root file, because
#     these patterns match the whole path from the repository root. Were
#     it otherwise, that entry would quietly defeat this one.
#
# `AGENTS.md` is on the list because it is prose and no step reads it.
# `.claude/**` stays there beside it and now matches one symlink, which
# resolves to that same file — the entry costs nothing and covers a
# checkout that has written its own `CLAUDE.md` under the directory.
#
# The licence texts and `FFMPEG-NOTICE.md` are on the list for the same
# reason the prose is: no step reads them. They are named rather than
# left to a glob so that the list stays a list of files somebody decided
# about — which is also why a fourth one arriving is a decision rather
# than a pattern quietly widening. `LICENSE-LGPL-2.1` and the notice
# beside it ship inside the bundle; nothing here looks at either, and
# the recipe that does look, `dogfood-build`, runs on the release path
# rather than this one.
#
# Two costs, both of which matter later rather than now.
#
# A required check would block. GitHub creates no check run for a
# skipped workflow: with none required, none is created and the check is
# absent; the requirement is what turns that absence into a *pending*
# check, and a prose-only pull request could never satisfy it. Stated
# that way round on purpose — what the repository requires today is a
# setting, and a comment that asserts a setting goes silently false the
# day someone changes it. The documented remedy
# is a second workflow of the same name carrying the inverse `paths`
# filter and doing nothing but succeed, and whoever turns protection on
# should reach for that rather than for this list. The `[skip ci]` note
# below reaches the same place by the other road, so both would have to
# be settled at once.
#
# A skipped commit cannot be asked for a verdict afterwards. No run
# object exists, so there is nothing to re-run — hence `workflow_dispatch`
# below, which is the whole escape hatch. It matters because `main`'s
# run is not only an answer about the diff that triggered it: the
# concurrency block treats it as the verdict on the merged tree, and a
# prose-only merge landing behind a failing code merge would otherwise
# leave `main`'s head with no check and no way to obtain one.
#
# The list is written twice because GitHub's workflow parser is not
# documented to accept YAML anchors, and a fragment that silently failed
# to expand would turn the filter off without saying so. Nothing keeps
# the two copies equal: a path added to one and not the other skips the
# branch but runs the merge, or the reverse, and neither says so. Edit
# them together.
on:
  pull_request:
    paths-ignore:
      - '.claude/**'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'FFMPEG-NOTICE.md'
      - 'LICENSE-APACHE'
      - 'LICENSE-LGPL-2.1'
      - 'LICENSE-MIT'
      - 'PUBLIC_DEVELOPMENT.md'
      - 'README.md'
      - 'SECURITY.md'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'FFMPEG-NOTICE.md'
      - 'LICENSE-APACHE'
      - 'LICENSE-LGPL-2.1'
      - 'LICENSE-MIT'
      - 'PUBLIC_DEVELOPMENT.md'
      - 'README.md'
      - 'SECURITY.md'

# On a pull request, a newer push makes the older run's answer irrelevant.
# On `main` it does not: two merges in quick succession would cancel the
# first commit's run and leave that commit with no verdict, which is the
# gap this workflow exists to close.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `write` for one reason: the regeneration step below commits
# `docs/aidoc/` back to the branch under test. Nothing else here writes,
# and the token is still scoped to this repository — a fork's pull
# request gets a read-only one, which is why that step skips itself
# there rather than failing on a push it was never going to be allowed
# to make.
permissions:
  contents: write

jobs:
  check:
    # All of `check` on macOS: the simple answer and the expensive one.
    # (The Windows job below is not the split weighed here. It runs
    # every gate but the Rust tests a second time, for the `cfg` code
    # this job never compiles, rather than moving any of them off
    # macOS.) The workspace is not uniformly portable —
    # `crates/asterism-ui/src-tauri` wants a webview toolkit, and the two
    # recipes above want macOS outright — so the alternative is a Linux
    # job for the portable crates plus a macOS job for the rest. That is
    # cheaper, introduces a second platform whose failures nobody sees
    # locally, and carries a detail worth pricing in before anyone commits
    # to it: `Justfile:1` sets `zsh` as just's shell, which Ubuntu runners
    # do not preinstall. Worth deciding against a measurement, which is
    # what this job exists to produce first.
    runs-on: macos-latest
    # Generous on purpose. The first run has no cache by definition and
    # compiles the workspace twice over — `clippy --all-targets`, then the
    # test build — with tantivy and a Lindera dictionary among the
    # dependencies. That run is also the measurement the split decision
    # above is waiting on, so a timeout that kills it destroys the thing it
    # was meant to produce.
    timeout-minutes: 90

    # Full debuginfo is written here and read never — nothing on a
    # runner opens a debugger. `line-tables-only` keeps the part that is
    # actually read (panic messages and backtraces still name the file
    # and line) and drops the rest.
    #
    # Where the time is, measured on a warm run on 2026-08-15 (run
    # 31906361509): the test build was 2 m 25 s of an 11 m 01 s job,
    # spent emitting debug info and linking it into every test binary in
    # the workspace — upwards of eighty, and the figure moves with the
    # crate count, so it is not written down here. The clippy and
    # `bindings-check` passes ahead of it link nothing, so the saving is
    # bounded by that one step.
    #
    # Set here rather than in a profile: a `Cargo.toml` override would
    # follow everyone home, and locally the full information is worth
    # what it costs. `dev` as well as `test` because the test binaries'
    # dependencies are built under `dev`, which is where most of those
    # bytes come from.
    #
    # The *second* run under these is the measurement, not the first.
    # `Swatinem/rust-cache` hashes every `CARGO*` and `RUST*` variable
    # into its restore key, so adding these two invalidates the whole
    # cache once: the first run rebuilds every dependency from cold and
    # says nothing about what the change bought. If the second run does
    # not move the test build, these two lines are noise and should come
    # back out.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only

    steps:
      # On a pull request this checks out the head branch rather than
      # the merge commit `pull_request` defaults to. The regeneration
      # step below commits to that branch, and a detached merge commit
      # is not something a commit can be pushed to — the checkout and
      # the push target have to be the same ref or the write has
      # nowhere to land.
      #
      # The cost, stated rather than left to be discovered: this job
      # then tests the branch, not the branch merged into `main`. A
      # change that is green alone and red merged is caught by the
      # `push: main` run instead of by the pull request, one step
      # later than before. Accepted because the alternative is a second
      # macOS job — the whole workspace compiled twice, on the runner
      # class that costs ten times a Linux minute — bought for a
      # difference that `main`'s own run already covers.
      #
      # Only for a pull request from this repository. A fork's head ref
      # does not exist here, so naming it would fail the checkout
      # outright; those runs keep the merge commit they always had, and
      # the regeneration step skips itself for the same reason. An
      # empty `ref` is checkout's own default — whatever triggered the
      # run.
      #
      # `persist-credentials` is the default and is what the push uses.
      - uses: actions/checkout@v7
        with:
          ref: >-
            ${{ (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository)
            && github.event.pull_request.head.ref || '' }}
          # Full history, because `check-changed` below asks which
          # workspace members this branch touched and answers it from
          # the merge base with `origin/main`. The default is a
          # single-commit clone with no `origin/main` and no shared
          # history to find a base in.
          #
          # The failure that would follow is why this is not left to be
          # discovered: a diff against a ref that does not resolve
          # produces no paths, which reads exactly like a branch that
          # changed no crate, and CI would report green having compiled
          # nothing. `changed-packages` refuses instead of answering,
          # and names this setting when it does — but the refusal is a
          # backstop, not the plan.
          fetch-depth: 0

      # There is no `rust-toolchain.toml`, so this follows stable and the
      # toolchain moves under the workflow. Deliberate, for now: clippy had
      # never run against this workspace until 2026-08-02, when a bump to
      # clippy 1.95 surfaced 46 violations across 26 files at once
      # (`rust-clippy`'s own comment records it). A CI that follows stable meets the next bump on
      # the day it lands, in a run nobody had to remember to start. The cost
      # belongs in the record too: a red run is then not always about the
      # change that triggered it. Pin here and in `[workspace.package]` if
      # that cost outgrows the coverage.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Caches `~/.cargo` and the dependency half of `target/`. The
      # workspace's own crates are deliberately not cached by this action,
      # so all 21 are recompiled and re-linted on every run — the verdict is
      # recomputed, not replayed. What the cache does hide is anything that
      # only appears when dependencies are built fresh; the sidecar resource
      # error of 2026-08-03/04 was that shape, and a run here would not see
      # it.
      #
      # Ahead of the two install steps below rather than after them,
      # which is where it used to sit. The action caches `~/.cargo/bin`
      # for anything installed while it is active, and `cargo-aidoc` is
      # built from source on every run — it publishes no release
      # binaries, so there is nothing for `cargo-binstall` or
      # `taiki-e/install-action` to fetch. Installed after the restore,
      # it lands in the cache and later runs find it already there;
      # installed before, it was rebuilt every time. Twenty seconds on
      # 2026-08-15, and the registry index the install reads is warm now
      # too.
      #
      # Two things follow from how the action saves. It writes a new
      # cache only when the restore missed or matched partially, so the
      # binary joins the cache on a run that rebuilds something and not
      # on one that hit its key exactly — this pays from the run after
      # the next miss, not necessarily the next run. And `cargo install`
      # still resolves `^0.3.0` against the registry every time, so a
      # restored binary that no longer satisfies the floor is replaced
      # rather than kept.
      - uses: Swatinem/rust-cache@v2

      # What `aidoc-guard` (inside `check`) needs, and the reason it is
      # here rather than left to warn. That step warns instead of failing
      # when it cannot run, which is right on a developer's machine — the
      # workspace pins no toolchain, and somebody without nightly must
      # still be able to run the full gate. On a runner it is wrong: a
      # runner has whatever it is told to have, and a step that warns on
      # every run is a step nobody reads. Installing these two is what
      # makes `docs/aidoc/` drift a red run rather than a line in a log.
      #
      # The hole was not hypothetical: a change that deleted a crate and
      # added another was committed with the artifacts still describing
      # the deleted one, and `just check` was green at the time.
      #
      # The nightly is dated, and the date is not written here. rustdoc's
      # JSON carries a `format_version`, every nightly emits exactly one,
      # and it moves whenever rustdoc's types do — asking for the channel
      # asks for whatever the schema is today, which failed here as
      # `expected 60, found 61`. `cargo-aidoc` names the toolchain whose
      # format it reads, so this asks the binary. A date pinned in this
      # file would be a second place to remember and would go stale the
      # moment the tool is upgraded.
      #
      # `rustup toolchain install` rather than a second
      # `dtolnay/rust-toolchain` step: that action makes what it installs
      # the default, so a nightly added that way would quietly move the
      # whole build — clippy, the tests, everything — onto nightly. Only
      # the rustdoc shell-out wants it.
      #
      # The floor on the tool is where this was found: `--title` and the
      # `[lib] name` fix shipped in 0.2.1, the toolchain pin in 0.2.2,
      # and the target record in 0.3.0. That last one is why the floor
      # is not merely "new enough to run": `docs/aidoc/` here describes
      # this runner's target, two of `asterism-infra`'s job modules are
      # behind `#[cfg(target_os = "macos")]`, and a regeneration from
      # any other machine deletes them from the committed inventory —
      # a deletion shaped exactly like an ordinary regeneration in the
      # diff. 0.3.0 refuses that write and reports the mismatch as
      # "not checked" (exit 3) instead of as drift.
      #
      # The floor rose to 0.4.0 when the `exclude` list left the
      # workspace manifest: that release removed the 512 KiB
      # `llms-full.txt` lint the list existed to stay under, and an
      # older tool would fail `--strict` on the full inventory this
      # workspace now documents.
      - name: Install cargo-aidoc
        run: cargo install cargo-aidoc --version '^0.4.0'

      - name: Install the nightly cargo-aidoc reads
        run: |
          rustup toolchain install \
            "$(cargo aidoc --print-required-toolchain)" --profile minimal

      # Three tests hard-require an ffmpeg binary and panic when it is
      # missing, deliberately: "this repo's fixture tests fail loudly rather
      # than skip silently, because a skipped gate reads as a passed one"
      # (`crates/asterism-infra/src/jobs/thumb_ffmpeg.rs:225-229`). The
      # runner image ships no ffmpeg, so without this step every run is red
      # on a missing dependency rather than on the change under review. The
      # `ffmpeg-sidecar` recipe is not the answer here — it writes to
      # `target/ffmpeg-sidecar/`, which is not one of the locations
      # `ffmpeg_binary()` searches, and it is minutes of source build. Both
      # this and `$ASTERISM_FFMPEG` are what the test's own panic message
      # tells you to do.
      - name: Install ffmpeg
        run: brew install ffmpeg

      # Nothing pins Node in the repository (no `.nvmrc`, no `engines`), and
      # the machine this was written on runs 21, which is past end of life.
      # 22 is the nearest LTS line above it. If CI and local drift far enough
      # to matter, the fix is an `.nvmrc` both sides read, not a second guess
      # here.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/asterism-ui/package-lock.json

      - uses: extractions/setup-just@v4

      # No recipe installs frontend dependencies: every `ui-*` recipe assumes
      # a populated `node_modules`, the same assumption a fresh worktree
      # breaks locally.
      - name: npm ci
        working-directory: crates/asterism-ui
        run: npm ci

      # `docs/aidoc/` is generated output, and this runner is the only
      # machine that can generate it correctly: two of
      # `asterism-infra`'s job modules are behind
      # `#[cfg(target_os = "macos")]`, rustdoc resolves `cfg` before it
      # emits anything, and a regeneration from anywhere else drops
      # them from the committed inventory. Asking a person to run
      # `just aidoc` on a Mac and commit the result is asking them to
      # be the build step for a fully deterministic artifact, so this
      # is that build step.
      #
      # It runs *before* `just check` rather than as a separate job on
      # purpose: regenerating into the tree this job is about to check
      # settles the artifacts in one run, where a fix pushed from a
      # second job would leave this pull request's own run red behind
      # it.
      #
      # `[skip ci]` is what keeps that to one run, and the reason it is
      # needed is worth stating because the opposite was written here
      # first. This comment used to say that a commit pushed with
      # `GITHUB_TOKEN` starts no workflow run. It does start one. On
      # 2026-08-15 the push below created run 31906361509, whose first
      # attempt is recorded as `conclusion: action_required` with
      # `triggering_actor: github-actions[bot]`: rather than dropping
      # the run, GitHub parked it behind an "Approve and run" button.
      # Why it did — the bot holding no write access is the obvious
      # guess — is not something the API says, and the last causal
      # claim written in this spot was wrong, so it stays a guess here.
      # What that cost is measured, on pull request #50: a human had to
      # click, five minutes passed
      # before anyone did, the approved run took another eleven minutes
      # to repeat work that was already done, and the concurrency group
      # cancelled the original run nine minutes in — after it had
      # pushed, and midway through the `just check` that was the point
      # of starting it. Two macOS runs and a manual step to answer a
      # question the first run had already answered.
      #
      # So the commit says `[skip ci]`, which suppresses runs for both
      # `push` and `pull_request`
      # (docs.github.com/en/actions/how-tos/manage-workflow-runs/skip-workflow-runs).
      # The verdict then comes from this run, over the tree this step
      # just wrote and pushed — which is the arrangement the paragraph
      # above always described.
      #
      # Two costs, stated rather than left to be found.
      #
      # The head commit carries no check of its own, because the check
      # is attached to the commit before it. A rule that demanded a
      # passing check on the head SHA would have to be reconciled with
      # this before it was turned on: requiring a check is what turns a
      # skipped workflow's absent check into a pending one, so such a
      # rule would block the merge rather than quietly pass it. The path
      # filter above reaches the same wall by the other road, and the
      # remedy named there — a companion workflow with the inverse
      # filter — is the one to reach for here too.
      #
      # The second is the one to watch, and it is why the merge button
      # matters here. Two of the three merge methods carry a branch
      # commit's message into `main`: a squash composes its body from
      # the branch's messages, a rebase replays the commit itself.
      # Either lands `[skip ci]` on `main`'s head, and the `push: main`
      # run — the one the concurrency block above exists to protect,
      # because it is what gives a merged tree its verdict — does not
      # start. A merge commit takes its message from the pull request
      # title and carries no branch message at all, which is the reason
      # to merge that way and to leave the other two off.
      #
      # Whether a merge commit is enough was an open question when this
      # was written, because GitHub says the token skips a workflow when
      # it appears "in a push" without saying which commit of one, and
      # its 2021 announcement said "any commit message in your push".
      # It is settled now, and by accident rather than by design. Pull
      # request #53 merged as a merge commit, and three commits in that
      # push carried the literal token in their messages — prose about
      # this very mechanism, written without thinking about what the
      # words would do. Under the broad reading `main` would have got no
      # run. It got run 31914528059. So the scan reads the head commit
      # of a push and not the range behind it, and a merge commit is
      # enough.
      #
      # That accident is also a hazard, and CONTRIBUTING carries the
      # rule it produced: do not write the literal token in a commit
      # message. On a push to `main` only the head commit is read, but a
      # `pull_request` event reads the pull request's head commit, so a
      # branch whose tip happens to discuss the token would have its own
      # run silently skipped — and a skipped workflow's checks sit at
      # pending rather than failing, which is not a state anyone
      # notices. File contents are safe; this comment is proof of that.
      #
      # `just aidoc` fails rather than writes when the committed
      # artifacts name a different target (cargo-aidoc 0.3.0), so a
      # change of canonical target is a red run and a decision, not a
      # silent rewrite.
      #
      # Skipped for pull requests from forks: the token is read-only
      # there, so there is nothing to push to. Not regenerating at all
      # in that case is deliberate — regenerating without pushing would
      # leave `aidoc-guard` comparing against a tree this step just
      # made current, which is a gate reporting its own output. On a
      # fork the flag below is therefore never set, and `aidoc-guard`
      # runs as the real gate it is everywhere else.
      #
      # `ASTERISM_AIDOC_REGENERATED` is what tells `aidoc-guard` that
      # this happened; the comment above that recipe lists the four
      # checks it stands down from and which step reaches each of them
      # first.
      - name: Regenerate docs/aidoc and commit what moved
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          just aidoc
          echo 'ASTERISM_AIDOC_REGENERATED=1' >> "$GITHUB_ENV"
          # Staged before the comparison rather than after it. The
          # ordering is the fix: `git diff` against the working tree
          # reads tracked paths only, so a difference visible only in an
          # untracked path left the tree looking unchanged, the step
          # reported "already current", and the artifact never reached
          # the repository. Comparing the index against `HEAD` is the
          # question actually being asked.
          #
          # The case that reaches: an artifact deleted by hand while the
          # module it describes still exists. Regeneration recreates it
          # as an untracked file and no tracked file moves. An added
          # crate or module was never affected — those also modify a
          # tracked index page, which the old comparison saw. `-A` is
          # for the deletions a human made, since plain `git add` on a
          # directory already covers the untracked half.
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/aidoc
          if git diff --cached --quiet -- docs/aidoc; then
            echo "docs/aidoc/ is already current."
            exit 0
          fi
          git commit -m 'Regenerate docs/aidoc [skip ci]'
          git push

      # Two steps naming two recipes, rather than one step and a
      # conditional inside it. The composition of each stays in the
      # Justfile, which is the rule the top of this file states; what
      # lives here is only the choice between them.
      #
      # A pull request is asked whether what it changed still holds, and
      # a branch that changed no crate links no test binary and runs no
      # lint — `bindings-check` still compiles `asterism-ui` and the
      # twelve members behind it. `main` is asked
      # whether the merged tree holds, which is the whole workspace —
      # including the dependent a branch broke without touching, the one
      # case `check-changed` gives up. That case surfaces here, one
      # merge later than it used to.
      - name: just check-changed
        if: github.event_name == 'pull_request'
        run: just check-changed

      - name: just check
        if: github.event_name != 'pull_request'
        run: just check

  # Every gate but the Rust tests, on Windows, so that code behind
  # `cfg(not(target_os = "macos"))` and `cfg(windows)` is compiled and
  # linted by the pull request that changes it. #306's "Open 4" comment
  # is the decision, and it names the ways to narrow this job, in order,
  # if what it costs turns out to be more than it is worth.
  #
  # This job is on the first of those: it compiles and lints, and the
  # Rust test suite does not run here. The suite holds tests written
  # against unix — paths split and joined on `/`, "absolute" read as a
  # leading `/`, `file://` endpoints built from native paths — and tests
  # whose disclosure writes Windows refuses with "Access is denied".
  # Those fail on every run whatever the pull request changed, so a
  # Windows test step would answer nothing about the change in front of
  # it, and making the tests portable is work of its own. The tests
  # answer in the macOS job; `rust-test` joins this one as a change to
  # it, made once the suite passes on Windows. That change owes the job
  # an ffmpeg as well: the tests that spawn one panic without it, as the
  # macOS job's install step says, and no gate here spawns it, so
  # nothing here installs it.
  #
  # A job of its own rather than a matrix over the one above, the shape
  # `release.yml` asks for too: the macOS job regenerates and pushes
  # `docs/aidoc/`, installs a nightly for it, and needs `contents: write`
  # to do so, and none of that belongs here.
  #
  # It names recipes and never calls cargo, for the rule at the top of
  # this file: a Windows step that called cargo directly would be a
  # second definition of green. What it names is `check-changed` and
  # `check` with `rust-test-changed` and `rust-test` left off —
  # `check-shared` plus `rust-clippy-changed` on a pull request,
  # `check-shared` plus `rust-clippy` everywhere else — so a gate added
  # to `check-shared` reaches this job as it reaches the macOS one.
  # There is no recipe for that pair: it is this job's narrowing, not a
  # definition of green anybody runs by hand, and a recipe for it would
  # be one more composition in the Justfile for `check`'s comment to
  # keep in step. `check-shared`'s comment in the Justfile says how a
  # gate that means nothing on Windows behaves there. `aidoc-guard` is
  # that case, and what it leaves out is this job's to say: nothing here
  # installs `cargo-aidoc` or its nightly, and nothing here regenerates
  # the artifacts. The macOS job in the same run is where they are
  # checked.
  #
  # `collation-jsc` is not in `check` and so not here either; the top of
  # this file says why it stays out of CI altogether.
  windows:
    runs-on: windows-latest
    # Set against a measurement. In run 36512441186, cold and with no
    # cache to restore, every step before the tests — `check-shared` and
    # the workspace clippy included — finished 13 minutes after the job
    # started. A cache is saved only by a run that succeeds, so a cold
    # run is the one to leave room for; this is several of them, and far
    # short of the six hours a hung step would otherwise hold a runner.
    timeout-minutes: 60
    # Read-only. The write permission at the top of this file is for the
    # macOS job's `docs/aidoc/` push, and this job pushes nothing.
    permissions:
      contents: read
    # Git for Windows' bash for every step, so a step and a recipe run
    # under the same shell. The Windows default is PowerShell.
    defaults:
      run:
        shell: bash
    env:
      # The check scripts read files with `read_text()` and no encoding,
      # which on Windows, before Python 3.15, means the ANSI code page
      # rather than UTF-8, and this repository's text is UTF-8. UTF-8
      # mode makes the default UTF-8 without the scripts learning about
      # Windows.
      PYTHONUTF8: '1'
      # The same two as the macOS job, whose comment gives the reason, so
      # that what this job costs is measured on the same terms as that one.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only

    steps:
      # Before the checkout, which is when it matters. The gates should
      # read the tree that was committed, not a conversion of it, and Git
      # on Windows converts two things on checkout by default.
      #
      # Line endings: LF becomes CRLF, and this repository has no
      # `.gitattributes` to say otherwise. prettier's `--check` then fails
      # every markdown file, and worse, `changed-packages` reads each
      # workspace member as a path ending in a carriage return, finds no
      # manifest under it, and reports that no member changed — which
      # skips clippy and reads as green.
      #
      # Symlinks: without `core.symlinks` a tracked symlink is written as
      # a small file holding its target's path. `.claude/CLAUDE.md` is one,
      # and prettier's `--check` fails on what that leaves.
      #
      # The tools step below fails the job if either conversion happened
      # anyway, rather than leaving a gate to trip over it.
      - name: Keep line endings and symlinks as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true

      # On a pull request, the head commit the run was started for,
      # named by SHA. The macOS job checks out the branch by name, which
      # is the same commit unless the branch moves before that job
      # starts; a SHA keeps this job on the commit the run is about,
      # including after the macOS job pushes its regeneration.
      # This job pushes nothing, so it needs no branch to push to. On a
      # fork's pull request the macOS job tests the merge commit instead,
      # for the reason its checkout gives; this job still tests the head.
      #
      # Full history for the reason the macOS job's checkout gives:
      # `check-changed` diffs against the merge base with `origin/main`.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || '' }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # `licence-check` and `third-party-check` read `cargo metadata
      # --offline`, which needs every platform's packages already on disk,
      # and a Windows build downloads only Windows's; nothing else in this
      # job reads the full graph before those gates run. `cargo fetch`
      # with no `--target` downloads for every platform, from the
      # lockfile as committed.
      - name: Fetch every platform's dependencies
        run: cargo fetch --locked

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/asterism-ui/package-lock.json

      - uses: extractions/setup-just@v4

      - name: npm ci
        working-directory: crates/asterism-ui
        run: npm ci

      # What the gates reach for, found or not by name here, so that a
      # missing one fails in seconds rather than after the minutes of
      # gates that ran before the first one needing it. `bash` is the
      # linewise recipes' shell, `cygpath` and `env` are how a shebang
      # recipe starts, `python` runs the check scripts, and every gate
      # runs through `just`, `cargo` or `npm`.
      # `HOME` is read when the Justfile loads, so every recipe needs it.
      # And the checkout is held to the first step's two settings: a file
      # committed with LF must not be CRLF on disk, and a tracked symlink
      # must be a symlink.
      - name: Check the checkout and the tools the gates reach for
        run: |
          failed=0
          for tool in bash cygpath env python just cargo npm; do
            if path=$(command -v "$tool"); then
              echo "$tool: $path"
            else
              echo "$tool: not found" >&2
              failed=1
            fi
          done
          echo "HOME: ${HOME:-<unset>}"
          [ -n "${HOME:-}" ] || failed=1
          converted=$(git ls-files --eol | grep 'i/lf *w/crlf' || true)
          if [ -n "$converted" ]; then
            echo "checked out with CRLF although committed with LF:" >&2
            printf '%s\n' "$converted" | head -20 >&2
            failed=1
          fi
          while IFS= read -r link; do
            if [ -L "$link" ]; then
              echo "symlink: $link"
            else
              echo "tracked symlink checked out as a file: $link" >&2
              failed=1
            fi
          done < <(git ls-files -s | awk '$1 == "120000" { print $4 }')
          exit "$failed"

      # The macOS job's last two steps without their test gate, and the
      # same choice between them; its comment gives the reasons, and the
      # comment on this job says why the tests are left off.
      - name: just check-shared rust-clippy-changed
        if: github.event_name == 'pull_request'
        run: just check-shared rust-clippy-changed

      - name: just check-shared rust-clippy
        if: github.event_name != 'pull_request'
        run: just check-shared rust-clippy
