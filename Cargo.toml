[workspace]
resolver = "2"
members = [
    "crates/asterism-core",
    "crates/asterism-infra",
    "crates/asterism-contract",
    "crates/asterism-server",
    "crates/asterism-importer-sdk",
    "crates/asterism-importer",
    "crates/asterism-media-probe",
    "crates/asterism-provenance",
    "crates/asterism-dispatch-sdk",
    "crates/asterism-exporter-comfy",
    "crates/asterism-exporter-file",
    "crates/asterism-exporter-http",
    "crates/asterism-importer-cc",
    "crates/asterism-importer-persona-journal",
    "crates/asterism-importer-tape",
    "crates/asterism-importer-image",
    "crates/asterism-importer-video",
    "crates/asterism-importer-audio",
    "crates/asterism-ui/src-tauri",
    "crates/asterism-benchgen",
]

[workspace.package]
authors       = ["Yutaka Nishimura <ytk.nishimura@gmail.com>"]
license       = "MIT OR Apache-2.0"
repository    = "https://github.com/ynishi/asterism"
homepage      = "https://github.com/ynishi/asterism"
documentation = "https://github.com/ynishi/asterism"
description   = "Persona/Char/Memory grid UI — local-first Asterism for personal AI companion footprints"
version       = "0.0.0"
edition       = "2024"

[workspace.dependencies]
# --- External integrations (kept commented out until reintroduced) ---
# The following crates were part of an earlier skeleton and were removed
# while the domain layer was rebuilt. Reintroduce them one by one as the
# corresponding integration surface lands.
# persona-pack     = "0.5"
# persona-journal  = "0.4"
# persona-wire     = "0.14"
# mini-app-mcp     = "0.16"
# outline-mcp-core = "0.11"
# agent-block-core = "0.30"
# journal-mcp      = "0.6"

# --- Tauri v2 (asterism-ui) ---
# `tauri-plugin-sql` is intentionally not used: SQLite access is unified
# under `rusqlite-isle`, and the plugin's `libsqlite3-sys` version does
# not coexist with `rusqlite 0.37` under a single `links = "sqlite3"`.
tauri = "2"

# --- asterism-server: HTTP API ---
axum = "0.8"
clap = { version = "4", features = ["derive"] }
# `ReaderStream` — the adapter that turns an open `tokio::fs::File` into
# the byte stream `axum::body::Body::from_stream` takes. Serving an
# asset's original by reading it into a `Bytes` first would make the
# largest allocation in the process proportional to the largest video in
# the library.
tokio-util = { version = "0.7", features = ["io"] }

# --- Common ---
# `tracing` is the one diagnostic channel: call sites emit through it,
# a fmt Layer writes to stderr (RUST_LOG-controlled), and the
# `asterism-infra` DiagLog Layer persists records to the `diag_log`
# table. `log` stays only as the bridge crate other libraries emit
# through (`tracing-log` picks those up).
log                = "0.4"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde       = { version = "1", features = ["derive"] }
# `preserve_order` makes `serde_json::Map` an `IndexMap`: a parsed object
# keeps the key order the document was written in, instead of being
# re-sorted on the way back out.
#
# Declared here because this workspace wants that semantic for its own
# sake. What it writes back out — an instruction file, a `.meta.json`
# sidecar, a `params_json` that made a round trip through the database —
# is somebody else's document, and handing it back with the keys
# re-sorted is an edit nobody asked for. Cargo unifies features across a
# workspace build, so the feature is on whether or not this line exists;
# stating it here makes it this workspace's decision rather than a side
# effect of somebody else's dependency, and makes removing it a decision
# too.
#
# It is **not** here for the reason this comment used to give. `c2pa`
# does declare the same feature in its own manifest — which is why the
# feature is unconditionally on today, and why removing this line would
# change nothing while that crate is a dependency. What was wrong was
# the *why*: the claim that `c2pa` needs an author's key order to
# survive a round trip. It does not.
# Verification re-hashes the bytes read out of the file rather than
# re-serialising a parsed model, and the default assertion kind routes
# through a CBOR map that sorts, discarding the author's key order
# before anything is encoded. The one path where an author's order does
# reach a signed digest is a custom label stamped `kind: "json"`, which
# `asterism-provenance` does not use.
#
# What must **not** rest on this line is any digest. A JSON object is an
# unordered collection of name/value pairs (RFC 8259), so a hash over
# "what the container carried" has to be a function of the content and
# not of the key order whoever wrote it happened to use — with the
# feature or without it. Four stored forms are *rendered by a
# serialiser* and then hashed or compared byte for byte, which is the
# set this line could reach, and each is independent of it for a reason
# of its own:
#
#   - `material_meta::render` serialises a `BTreeMap<String, String>`
#     and keeps every value as the container stated it, unparsed.
#   - `series::render` does parse — a rule selects by path, so it has
#     no choice — and sorts every nested object back through
#     `series::canonical_value` before rendering.
#   - `source_locator::to_storage` serialises a private enum through
#     serde's struct path, so no `serde_json::Map` is constructed.
#   - `snapshot_hash` hashes an ordered list of ids and touches no JSON.
#
# The digests this line cannot reach at all are the ones over bytes
# nothing here serialised: the artefact digest over a whole file, and
# the content-region digest over the subset of it a probe selected.
# They are listed nowhere above because the question does not arise for
# them, not because they were forgotten. `source_locator`'s stored form
# has one thing the others do not — a second producer, in the V63
# migration, which has to render byte-identically to `to_storage` or
# the equality lookup on the column splits by which wrote the row.
#
# "Built from a struct rather than parsed" is *not* one of those
# reasons, and reading it as one is what left this comment claiming a
# discharge it had not made: `serde_json::to_value` produces a `Map`
# too, so a value that never saw a parser is still an `IndexMap` under
# this feature. What makes the four safe is what each one feeds the
# hash, which is why they are listed one by one.
#
# A digest added beside them owes the same statement, and the rule it
# owes is written where the axes are defined (`domain::content_hash`):
# say whether it selects bytes or re-renders them, and if it re-renders,
# specify the canonical form and version the tag.
serde_json  = { version = "1", features = ["preserve_order"] }
tokio       = { version = "1", features = ["full"] }
anyhow      = "1"
thiserror   = "2"
async-trait = "0.1"
uuid        = { version = "1", features = ["v7", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
sha2        = "0.10"
# Base64. Declared here for the reason `reqwest` is: two crates read the
# *same* payloads — `asterism-importer-sdk`'s PNG chunk reader decodes a
# character card's `ccv3`, and `asterism-core`'s `domain::series` decodes
# it again to derive a series key — so what "standard base64" accepts has
# to be one answer. Pinned separately, a major bump on one side would
# move that boundary for one reader and not the other, and the symptom
# would be a key that stops being derived for cards the importer still
# accepts.
base64      = "0.22"
# HTTP client. Declared at the workspace level so the four crates that
# already pinned this exact line by hand (server / importer-sdk / the two
# exporters) and `asterism-benchgen`'s `load-file` loader cannot drift
# into two reqwest builds — one TLS backend, one linked copy.
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# --- asterism-core: string collation ---
# The grid sort is a two-sided contract (`domain::sort_eval` +
# `asterism-ui/src/lib/sort/card-cmp.ts`) and its order is frozen into
# `asset_bucket.position`, so both halves must agree on how strings
# compare. The UI half is ICU via `Intl.Collator`; this is the Rust
# half. `compiled_data` (default) bakes CLDR in, so there is no data
# file to ship or locate at runtime.
icu_collator    = "2.2"
icu_locale_core = "2.2"

# --- asterism-contract: TypeScript / MCP schema bridge ---
schema-bridge = "0.4"
# JSON Schema derive for the MCP tool inputs. Optional on the contract
# crate (feature `json-schema`) so the TS-bindings path stays free of
# it; `rmcp` integrates with schemars 1.x for `Parameters<T>` schemas.
schemars = "1"

# --- asterism-server: MCP transport ---
# Official MCP Rust SDK. `transport-streamable-http-server` is the tower
# service nested under `/mcp` on the same axum router as the HTTP API;
# `transport-io` is the stdio pair behind `asterism-server mcp`; the
# client features are what that stdio proxy uses to forward requests to
# the running app's `/mcp` (see `mcp_proxy` — the proxy must start with
# no backend up, so the connection is made lazily per access).
rmcp = { version = "3", features = [
    "transport-streamable-http-server",
    "transport-io",
    "client",
    "transport-streamable-http-client-reqwest",
] }

# --- asterism-infra: SQLite access ---
# `rusqlite-isle` publishes separate release lines per `libsqlite3-sys`
# cluster (0.2 = 0.28 / 0.3 = 0.30 / 0.4 = 0.35 — see the crate's
# CHANGELOG). Asterism coexists with `apalis-sql` (sqlx 0.8 =
# libsqlite3-sys 0.30), so we pin the 0.3 line to keep a single copy of
# `sqlite3` linked (verified by `cargo tree`).
rusqlite-isle = { version = "0.3", features = ["tokio", "pool"] }
rusqlite      = { version = "0.32", features = ["bundled", "uuid"] }

# --- asterism-infra: filesystem + media pipeline (future work) ---
walkdir      = "2"
notify       = "8"
image        = "0.25"
rayon        = "1"
kamadak-exif = "0.6"
# Dominant-color / palette extraction. Runs on the decoded thumbnail
# buffer inside `thumb_gen` so the extra cost is amortised — no
# separate image decode.
color-thief  = "0.2"

# --- asterism-benchgen: seeded synthetic corpus ---
# The bench corpus is defined by its seed, not by the files it happens to
# have produced: `rand_chacha`'s ChaCha20 is reproducible across platforms
# and versions of the crate, so `SpecStream::new(seed)` is the identity of
# a corpus and the manifest only records what that identity realised.
# `rand` alone would not do — its thread/OS generators are explicitly not
# reproducible.
rand        = "0.9"
rand_chacha = "0.9"

# --- asterism-infra: C2PA signing ---
# The CAI reference SDK, and the only realistic way to produce a
# manifest: a C2PA claim is COSE-signed CBOR wrapped in JUMBF, embedded
# per container (APP11 for JPEG, a chunk for PNG, a box for MP4/MOV),
# with a hard binding computed over byte ranges the format decides. That
# is a specification-sized problem, not a serialisation one.
#
# Confined to `asterism-infra::provenance`. Everything that decides *what
# is asserted* lives in `asterism-provenance`, which does not take this
# dependency and can therefore be tested on a machine with no
# cryptography backend and no certificate.
#
# `default-features = false` drops two defaults that are wrong here:
#
# - `openssl` — a vendored C build, replaced by `rust_native_crypto` so
#   this workspace keeps one toolchain and no system library to locate.
#   Exactly one of the two must be on.
# - `default_http` — four HTTP client backends, pulled in for fetching
#   remote manifests and timestamps. This workspace already pins one
#   `reqwest` line deliberately (see above), and a local-first exporter
#   has no business reaching the network while it signs. A timestamp
#   authority is configuration; if one is ever configured, the feature
#   comes back with a comment saying which client it added.
#
# `file_io` is what `create_signer::from_files` needs — the certificate
# and key arrive as paths from settings.
c2pa = { version = "0.90", default-features = false, features = [
    "rust_native_crypto",
    "file_io",
] }

# --- asterism-infra: job engine ---
apalis     = { version = "0.7", features = ["limit"] }
apalis-sql = { version = "0.7", features = ["sqlite", "tokio-comp"] }

# --- asterism-infra: session snapshot (rkyv zero-copy over mmap) ---
# The datastore is effectively immutable: writes happen per rebuild,
# and queries do a zero-copy read via rkyv `archived_root` over memmap,
# leaving caching to the kernel. Details in the `sqlite/session_view.rs`
# module doc. `bytecheck` is pinned explicitly as a peer dep on the
# matching line (rkyv 0.7 → bytecheck 0.6) because rkyv 0.7's
# `validation` feature requires the CheckBytes derive to resolve at the
# top-level crate.
rkyv      = { version = "0.7", features = ["validation"] }
bytecheck = "0.6"
memmap2   = "0.9"

# --- asterism-infra: full-text search index (Tantivy + Lindera) ---
# Full-body BM25 index with Lindera Japanese morphological analysis and
# a Porter stemmer (English) on a single tokenizer chain, persisted to a
# disk index (`~/.asterism/tantivy/`). It is a durability channel
# separate from the SQLite tx; on crash the `index_rebuild` job
# reconstructs it. Details in the `asterism-infra/src/search/` module
# doc.
tantivy = "0.25"
lindera = "4"
lindera-tantivy = { version = "4", features = ["embed-ipadic"] }
