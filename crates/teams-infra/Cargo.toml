[package]
name = "teams-infra"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
repository.workspace = true
homepage.workspace   = true
description = "Infrastructure adapters for the Asterism teams plane — SQLite, local blob storage, auth (follow-up slices of #83)"
# The decision #83 §4 deferred to publish time, made at v0.1.0 (#162).
license     = "AGPL-3.0-or-later"
# Not published to crates.io.
publish     = false

[lib]

[dependencies]
# The teams plane depends on `teams-core` and owns its own plumbing
# (#83 §4 — never asterism-infra / -contract / -server here).
teams-core = { path = "../teams-core" }

# The one asterism-* edge, and #83 §4 permits it outright: hosting the
# forge on the team plane means implementing the ports `asterism-core`
# already declares (#148 decision 20), so the forge's model and its
# port traits are named here and nothing below them is.
asterism-core = { path = "../asterism-core" }

# SQLite access, same line as the rest of the workspace: `rusqlite-isle`
# provides the thread-isolated actor, `rusqlite` is depended on directly
# for its types (params!, Connection in init closures, uuid bridge).
rusqlite-isle = { workspace = true }
rusqlite      = { workspace = true }

anyhow     = { workspace = true }
serde_json = { workspace = true }
uuid       = { workspace = true }
# The forge's acts carry a `DateTime<Utc>`; the columns carry epoch ms,
# and the conversion between the two is this crate's.
chrono     = { workspace = true }

# Auth v0 (#83 §5): argon2id hashing through RustCrypto — never hand-rolled.
argon2 = { workspace = true }
# Session tokens are stored hashed: the table keeps the SHA-256 of the
# opaque token, so the database never contains a usable bearer token.
sha2 = { workspace = true }
# 256-bit session tokens and argon2 salts come from the OS CSPRNG
# (`rand::rngs::OsRng`); already a workspace line for asterism-benchgen.
rand = { workspace = true }
# `teams-core::port::auth::CredentialVerifier` is an async trait.
async-trait = { workspace = true }
# OIDC sign-in (#163): the instance is the provider's OAuth client, so
# this crate is where discovery, the code exchange and the ID-token
# check live. The workspace manifest says why the signature check is a
# crate and the rest is `reqwest`.
jsonwebtoken = { workspace = true }
reqwest      = { workspace = true }
serde        = { workspace = true }
# The PKCE challenge is the base64url form of a SHA-256, RFC 7636 §4.2.
base64       = { workspace = true }
# The blob adapter's write path (#83 §3): async fs for the staging
# file, the fsyncs and the rename. Promoted from dev-dependency when
# the adapter landed (#93) — until then only the tests were async.
tokio = { workspace = true }

# A real dependency, not only dev, the same promotion asterism-infra
# made for the same mechanism: the profile-marker publish writes its
# contents to a `NamedTempFile` (created `O_EXCL` and 0600) and hard-
# links it into place, so no observable state ever holds an empty or
# half-written marker. The backup module (#95) leans on it a second
# time: the `VACUUM INTO` snapshot lands in a local tempdir, never at
# the (possibly network-mounted) destination.
tempfile = "3"

# The backup archive (#95): DB-first tar, plain and uncompressed — the
# workspace manifest's `tar` line carries the reasoning.
tar = { workspace = true }

[dev-dependencies]
tempfile = "3"
