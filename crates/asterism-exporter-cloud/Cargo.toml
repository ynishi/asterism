[package]
name        = "asterism-exporter-cloud"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
description = "Profile-driven exporter for hosted generation APIs — names its credential, takes custody of the produced bytes, and carries its own deadline"
publish     = false

[lib]

[dependencies]
asterism-contract        = { path = "../asterism-contract" }
asterism-dispatch-sdk    = { path = "../asterism-dispatch-sdk" }
asterism-exporter-common = { path = "../asterism-exporter-common" }

serde       = { workspace = true }
serde_json  = { workspace = true }
anyhow      = { workspace = true }
async-trait = { workspace = true }
chrono      = { workspace = true }
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio       = { workspace = true }

[dev-dependencies]
tempfile = "3"
