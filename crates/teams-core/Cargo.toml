[package]
name = "teams-core"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
repository.workspace = true
homepage.workspace   = true
description = "Domain layer of the Asterism teams plane — identity, ledger envelope, store rules, ports (IO-free)"
# license deliberately undeclared until the teams-plane licensing decision (issue #83 §4)
# Not published to crates.io.
publish     = false

[lib]

[dependencies]
# The asterism-* vocabulary the teams plane reuses (#83 §4): the digest
# notation and its parsing rules, taken as-is rather than re-spelled.
#
# The never-list is asterism-infra, asterism-server, and the local app's
# request/response shapes — asterism-contract's command, query and dto.
# Those are the desktop surface, and a team-plane type stated in them
# would tie the hosted plane to it; teams-infra owns its own plumbing
# for the same reason. asterism-contract::forge is off that list: it is
# the forge's own vocabulary, and it already rides in transitively
# behind asterism-core (where the digest notation lives), so naming it
# adds no edge the graph does not already have. The direction the
# license boundary guards is the reverse one, asterism-* → teams-*,
# which stays empty.
asterism-core = { path = "../asterism-core" }

serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }
async-trait = { workspace = true }
uuid        = { workspace = true }
