[package]
name = "asterism-importer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Unified Asterism import CLI"
publish = false

[[bin]]
name = "asterism-import"
path = "src/main.rs"

[dependencies]
asterism-importer-sdk = { path = "../asterism-importer-sdk" }
asterism-importer-cc = { path = "../asterism-importer-cc" }
asterism-importer-image = { path = "../asterism-importer-image" }
asterism-importer-video = { path = "../asterism-importer-video" }
asterism-importer-audio = { path = "../asterism-importer-audio" }
asterism-importer-text = { path = "../asterism-importer-text" }
asterism-importer-persona-journal = { path = "../asterism-importer-persona-journal" }
asterism-importer-tape = { path = "../asterism-importer-tape" }

anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# For `tests/import_run_e2e.rs`, which drives this binary the way the
# server does: stored definition, spawned child, records landing over
# HTTP. It needs a real server to push to, and the binary has to be the
# one cargo built — `CARGO_BIN_EXE_asterism-import` is defined only for
# tests of the crate declaring it, which is why the test is here rather
# than beside the supervisor it exercises.
#
# Not a cycle: `asterism-server` depends on the importer SDK and the
# image parser, never on this crate.
[dev-dependencies]
asterism-server = { path = "../asterism-server" }
asterism-contract = { path = "../asterism-contract" }
asterism-core = { path = "../asterism-core" }
axum = { workspace = true }
tempfile = "3"
