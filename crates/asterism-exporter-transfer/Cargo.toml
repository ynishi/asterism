[package]
name        = "asterism-exporter-transfer"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
description = "Transport exporter — puts a release's stamped files and a CSV sidecar on a host over SFTP, FTPS or FTP"
publish     = false

[lib]

[dependencies]
asterism-contract        = { path = "../asterism-contract" }
asterism-dispatch-sdk    = { path = "../asterism-dispatch-sdk" }
asterism-exporter-common = { path = "../asterism-exporter-common" }

serde       = { workspace = true }
serde_json  = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
async-trait = { workspace = true }
tokio       = { workspace = true }

# The root certificates an FTPS send trusts. The Mozilla set rather than
# the platform's store, so what a send trusts is not a property of the
# machine it ran on. The same choice this workspace already made for its
# HTTP client rather than a second one — `ftp.rs` says it beside the
# code that uses it.
webpki-roots = "1"

# SSH and its SFTP subsystem. `russh` speaks the transport and the
# authentication; `russh-sftp` is the subsystem on top of one of its
# channels. Two crates because SFTP is a protocol carried over SSH
# rather than a part of it, and the split is the upstream authors'.
#
# What the choice is actually about is the build, not the language:
# nothing here may need a library found on the machine it is built on.
# The alternative in this space is `libssh2-sys`, which locates a system
# libssh2, and this workspace already refuses that trade for the same
# reason it builds `c2pa` with `rust_native_crypto`.
#
# Which is why the default features are off. russh's default crypto
# backend is `aws-lc-rs`, whose `aws-lc-sys` drives a cmake build of
# AWS-LC; `ring` is the backend russh offers instead and the one the
# rest of this workspace already resolves. Neither is pure Rust — ring
# vendors C and assembly from BoringSSL — so the gain is one vendored
# toolchain instead of two, not an absence of C. `flate2` and `rsa` are
# the other two defaults, kept because dropping them would drop wire
# compression and RSA host and client keys, which is a narrower SSH than
# an agency's host may offer.
russh      = { version = "0.63", default-features = false, features = [
    "ring",
    "flate2",
    "rsa",
] }
russh-sftp = "3"

# FTP and FTPS. `tokio` selects the async client — the crate ships a
# blocking one by default, and a blocking socket inside an exporter
# would hold a runtime thread for the length of an upload.
# `tokio-rustls-ring` is the TLS backend, and it is rustls over ring so
# the workspace keeps the one it already pins for `reqwest`; the
# alternatives on offer are native-tls, which locates the platform's own
# TLS, and aws-lc-rs, which is the second vendored toolchain the russh
# paragraph above declines for the same reason.
suppaftp = { version = "12", default-features = false, features = ["tokio", "tokio-rustls-ring"] }

[dev-dependencies]
tempfile = "3"
