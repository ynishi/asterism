[package]
name        = "asterism-exporter-transfer"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
description = "Transport exporter — puts a release's stamped files and a CSV sidecar on a host over SFTP, FTPS or FTP"
publish     = false

[lib]

[dependencies]
asterism-contract        = { path = "../asterism-contract" }
asterism-dispatch-sdk    = { path = "../asterism-dispatch-sdk" }
asterism-exporter-common = { path = "../asterism-exporter-common" }

serde       = { workspace = true }
serde_json  = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
async-trait = { workspace = true }
tokio       = { workspace = true }

# The root certificates an FTPS send trusts. The Mozilla set rather than
# the platform's store, so what a send trusts is not a property of the
# machine it ran on. The same choice this workspace already made for its
# HTTP client rather than a second one — `ftp.rs` says it beside the
# code that uses it.
webpki-roots = "1"

# SSH and its SFTP subsystem. `russh` speaks the transport and the
# authentication; `russh-sftp` is the subsystem on top of one of its
# channels. Two crates because SFTP is a protocol carried over SSH
# rather than a part of it, and the split is the upstream authors'.
#
# `russh` rather than `libssh2-sys` because that one locates a system
# libssh2, which the native-code rule in the root manifest refuses —
# it is stated at the `c2pa` pin there.
#
# `ring` rather than russh's default `aws-lc-rs` because it is the
# provider this crate's own TLS client already resolves, so the transfer
# crate brings in no backend of its own. `flate2` and `rsa` are russh's
# other two defaults, kept: dropping them would drop wire compression
# and RSA host and client keys, which is a narrower SSH than an agency's
# host may offer.
russh      = { version = "0.63", default-features = false, features = [
    "ring",
    "flate2",
    "rsa",
] }
russh-sftp = "3"

# FTP and FTPS. `tokio` selects the async client — the crate ships a
# blocking one by default, and a blocking socket inside an exporter
# would hold a runtime thread for the length of an upload.
# `tokio-rustls-ring` is the TLS backend: rustls over the same `ring`
# the russh line above names, which is what this crate's TLS client
# already resolves. Among the alternatives suppaftp offers is a
# native-tls one, which locates the platform's own TLS — refused by the
# native-code rule in the root manifest.
suppaftp = { version = "12", default-features = false, features = ["tokio", "tokio-rustls-ring"] }

[dev-dependencies]
tempfile = "3"
