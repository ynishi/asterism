[package]
name        = "asterism-infra"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
description = "Outbound adapter for Asterism — rusqlite-isle / FS / apalis-sqlite JobStore impl"
# Not published to crates.io.
publish     = false

[lib]

[dependencies]
asterism-core         = { path = "../asterism-core" }
asterism-contract     = { path = "../asterism-contract" }
asterism-dispatch-sdk = { path = "../asterism-dispatch-sdk" }
# The dimension backfill measures through the same code the importers
# measure through — that is the reason the crate was split out of them.
# Both features, because the walk meets stills and clips in one table.
asterism-media-probe  = { path = "../asterism-media-probe", features = ["image", "video"] }

tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
async-trait = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }

# Filesystem + media pipeline (declared for the imminent thumbnail /
# EXIF work; not yet used in code).
walkdir      = { workspace = true }
notify       = { workspace = true }
image        = { workspace = true }
rayon        = { workspace = true }
kamadak-exif = { workspace = true }
color-thief  = { workspace = true }

# Job engine: apalis + the apalis-sql SQLite backend (sqlx 0.8 =
# libsqlite3-sys 0.30, aligned with the `rusqlite-isle` 0.3 line — see
# the workspace `Cargo.toml` for the rationale).
apalis     = { workspace = true }
apalis-sql = { workspace = true }

# SQLite access: `rusqlite-isle` provides a thread-isolated actor with
# cancellation and an optional reader pool. `rusqlite` is depended on
# directly so closures can call its API (isle does not re-export it).
rusqlite-isle = { workspace = true }
rusqlite      = { workspace = true }

# Session snapshot: rkyv archived Vec + memmap-backed zero-copy read.
# `list_sessions` drops the SQL aggregate in favour of a single
# precomputed-snapshot lookup, taking seconds down to the microsecond
# band. Details in `sqlite/session_view.rs`.
rkyv      = { workspace = true }
bytecheck = { workspace = true }
memmap2   = { workspace = true }

# Full-text search: Tantivy on-disk index + Lindera Japanese tokenizer.
# Full-body BM25 index; disk footprint at ~1 KB body per asset is
# 0.1-0.2 MB * 100k = ~20 MB [estimated]. The IPADIC dictionary is
# embedded into the crate at first build (~50 MB extra compile
# artifact, no runtime download).
tantivy = { workspace = true }
lindera = { workspace = true }
lindera-tantivy = { workspace = true }

# AI disclosure. The vocabulary and the rule are in the core; the two
# renderings — the XMP packet and the manifest definition — come from
# `asterism-disclosure-format`, which is pure. `c2pa` is here because
# signing is the one part that needs key material and a cryptography
# backend, and `disclosure.rs` is the only module that touches it. See
# the workspace `Cargo.toml` for which default features are off and why.
asterism-disclosure-format = { path = "../asterism-disclosure-format" }
c2pa = { workspace = true }
# Decoding the PEM a signing identity arrives as, so the refusal of the
# C2PA test certificates can look at the DER rather than only at whatever
# comment lines happen to surround it. The workspace line, for the reason
# it is a workspace line: what "standard base64" accepts is one answer
# here.
base64 = { workspace = true }
# Reading a configured signing certificate's own extensions. `c2pa`
# parses certificates for its own validation and exposes none of it, so
# the check is this crate's; the workspace line says why the version is
# where it is.
x509-parser = { workspace = true }
# Staging a rewrite. Not for the convenience: the name has to be
# unpredictable and the file has to be created with `O_EXCL` and mode
# 0600, because the directory a stamped file is written into is not
# necessarily one only this process can write to. Was a dev-dependency
# until the provenance writer's own temporary was found to be a
# deterministic sibling opened with neither.
tempfile = "3"

[dev-dependencies]
tempfile = "3"
# Fixture builder for the PNG-shaped test corpus used by the walker /
# fingerprint / job-handler tests. Same rationale as the sibling dev-dep
# in `asterism-importer-sdk`: building PNGs by hand is the chunk-boundary
# arithmetic these tests just stopped doing.
pngmeta  = { version = "0.2.1", features = ["test-util"] }
# The disclosure tests build a PNG chunk by hand to have a container to
# stamp, and a chunk needs its CRC — the same line
# `asterism-disclosure-format` takes for the writer itself.
crc32fast = "1"
# A throwaway signing identity, so the signing path is exercised rather
# than described. This repository ships no certificate and refuses the
# C2PA test ones, which would otherwise leave every claim about signing
# untested — including the ordering claim that the XMP packet is inside
# what gets signed, which is only observable once a signature exists.
# Generated per test run and never written outside the temporary
# directory.
rcgen = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
# ImageIO fast path for `thumb_gen` — uses Apple's ImageIO framework
# (backed by the M-series HW JPEG decoder where available) instead of
# the pure-Rust `image` crate, keeping CPU load off the wave-decode
# path so other work on the box stays responsive.
objc2-core-foundation = { version = "0.3", features = ["CFDictionary", "CFNumber", "CFURL", "CFData"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage"] }
objc2-image-io = { version = "0.3", features = [
    "objc2-core-graphics",
    "CGImageSource",
    "CGImageDestination",
] }
# Video frame extraction for `thumb_gen`. Neither ImageIO above nor the
# `image` crate can decode a video, so a video asset would have no
# thumbnail at all; AVFoundation's `AVAssetImageGenerator` pulls one
# frame as a `CGImage`, which the ImageIO encoder above then turns into
# the same JPEG blob shape every other thumbnail uses. The call is
# synchronous, so it fits the existing `spawn_blocking` decode path.
# macOS-only by construction — see `thumb_video` for what other
# platforms do instead.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSValue", "NSString"] }
objc2-core-media = { version = "0.3", features = ["CMTime"] }
objc2-av-foundation = { version = "0.3", features = [
    "objc2-core-media",
    "AVAsset",
    "AVAssetImageGenerator",
] }
