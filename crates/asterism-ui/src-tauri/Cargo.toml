[package]
name        = "asterism-ui"
description = "Tauri v2 desktop UI for Asterism — dense grid + hover constellation burst"
# Not published to crates.io.
publish     = false
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace   = true

[lib]
name       = "asterism_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "asterism-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build    = { version = "2", features = [] }
asterism-contract = { path = "../../asterism-contract" }
# The team plane's own vocabulary. `asterism-contract` carries the forge
# DTOs a shared line answers with, because the forge is the same on both
# planes (#148 decision 19) — but a session, a roster and a ledger page
# are the teams wire's, and a screen over any of them needs the shape
# named in TypeScript. The leaf is MIT/Apache and depends on neither
# plane, which is the arrangement #83 §4 prescribes for exactly this.
asterism-teams-wire = { path = "../../asterism-teams-wire" }
schema-bridge  = { workspace = true }

[dev-dependencies]
# `export_parity` reads the contract's sources and this crate's build
# script, and pairs what one derives against what the other exports. Both
# halves are syntax — a `SchemaBridge` inside a doc comment is a type that
# does not exist, and a derive list rustfmt wrapped is a type that does and
# would go unread. Same features and version `asterism-core` takes for
# `forge_boundary`: `full` for item syntax, `visit` for the traversal,
# `parsing` to get there from a string.
syn = { version = "2", features = ["full", "visit", "parsing"] }

[dependencies]
asterism-core           = { path = "../../asterism-core" }
asterism-infra          = { path = "../../asterism-infra" }
asterism-contract       = { path = "../../asterism-contract" }
asterism-dispatch-sdk   = { path = "../../asterism-dispatch-sdk" }
asterism-server         = { path = "../../asterism-server" }
asterism-exporter-comfy = { path = "../../asterism-exporter-comfy" }
asterism-exporter-file  = { path = "../../asterism-exporter-file" }
asterism-exporter-http  = { path = "../../asterism-exporter-http" }

# The member's half of a shared line (#148 decision 15 / #153). This is
# the edge the panel needs and the only one it may draw: `asterism-* ->
# teams-*` is forbidden in any form by #83 §4, and `asterism-teams-client`
# is not a `teams-*` crate — it is the client, which depends on the wire
# leaf and on nothing in the teams plane. Adding `teams-core`,
# `teams-infra`, `teams-contract` or `teams-server` here would be the
# forbidden edge; this is not.
asterism-teams-client   = { path = "../../asterism-teams-client" }
# Named directly as well as through the client, because a command's
# signature is one of the wire's own types and the client re-exports
# only what it wraps.
asterism-teams-wire     = { path = "../../asterism-teams-wire" }

serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
chrono      = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
async-trait = { workspace = true }

tauri            = { workspace = true, features = ["protocol-asset"] }
# `tauri-plugin-log` removed: it only installed in debug builds, so a
# bundled app produced no diagnostics at all. `asterism_infra::diag`
# installs one subscriber for every build and also persists to
# `diag_log`.

# Loopback HTTP serve inside the UI process (headless-arch C'): the UI
# holds the single core and serves `asterism_server::http::router`.
axum = { workspace = true }

tracing = { workspace = true }

# WebDriver surface for the e2e suite (`just ui-e2e`). macOS ships no
# WKWebView driver, so `tauri-driver` cannot reach this app and the W3C
# server has to run inside it. `-wdio-webdriver` is that server (port
# 4445); `-wdio` adds the backend half the specs use —
# `browser.tauri.execute()`, IPC mocking, backend log capture.
#
# Behind a feature, not `[target.'cfg(debug_assertions)'.dependencies]`
# as upstream suggests. Cargo resolves target-cfg tables against the
# *target spec*, which carries no `debug_assertions` — the table is
# always active, so it gates nothing. Measured 2026-07-31: with the
# upstream form, a `--release` binary still carried the plugins' ACL
# strings (`wdio:allow-execute`, `plugin:wdio|execute`). The `#[cfg]`
# on the `init()` call kept the server from starting, but "release
# cannot link this" was not true.
#
# A feature is opt-in at the command line, so the default `cargo build`
# — including `just dogfood-build`, which produces the app that holds
# real data — never pulls it in. `just ui-e2e` passes `--features wdio`.
[features]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
# The ONNX encoder path (#112). The app process is the one that runs
# job workers, so this is the binary the feature matters on — the
# standalone server's serve mode only enqueues. Same default-off
# reasoning as the server's flag.
vision = ["asterism-server/vision"]

[dependencies.tauri-plugin-wdio]
version  = "1"
optional = true

[dependencies.tauri-plugin-wdio-webdriver]
version  = "1"
optional = true
