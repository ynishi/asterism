[package]
name        = "asterism-exporter-comfy"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
description = "ComfyUI HTTP exporter for Asterism — implements asterism-dispatch-sdk::Exporter against a running ComfyUI backend"
publish     = false

[lib]

[dependencies]
asterism-contract        = { path = "../asterism-contract" }
asterism-dispatch-sdk    = { path = "../asterism-dispatch-sdk" }
# The `{{...}}` substitution the workflow graph is rendered through,
# and the custody layout the harvested files are written into — both
# shared with the http adapter rather than restated here.
asterism-exporter-common = { path = "../asterism-exporter-common" }

serde       = { workspace = true }
serde_json  = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
async-trait = { workspace = true }
chrono      = { workspace = true }
uuid        = { workspace = true }
# `multipart` is for `POST /upload/image`, the only way a file reaches
# ComfyUI's `input/` directory from outside its process.
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio       = { workspace = true }
# Draws the seed a caller left blank; `params_with_seed` says why.
rand        = { workspace = true }
