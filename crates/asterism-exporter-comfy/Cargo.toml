[package]
name        = "asterism-exporter-comfy"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
description = "ComfyUI HTTP exporter for Asterism — implements asterism-dispatch-sdk::Exporter against a running ComfyUI backend"
publish     = false

[lib]

[dependencies]
asterism-contract     = { path = "../asterism-contract" }
asterism-dispatch-sdk = { path = "../asterism-dispatch-sdk" }

serde       = { workspace = true }
serde_json  = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
async-trait = { workspace = true }
chrono      = { workspace = true }
uuid        = { workspace = true }
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
