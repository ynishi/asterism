[package]
name = "teams-server"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
repository.workspace = true
homepage.workspace   = true
description = "Hosted Team server for Asterism — its own binary, fully separate from asterism-server (#83 §4)"
# license deliberately undeclared until the teams-plane licensing decision (issue #83 §4)
# Not published to crates.io.
publish     = false

# Its own [[bin]], fully separate from the asterism-server binary: the
# only asterism-* crates in this binary are asterism-core, what it
# brings (its own deps ride along transitively), and asterism-contract,
# which declares no Asterism dependency at all and already rode in this
# graph transitively through asterism-core. No asterism-* crate depends
# on any teams-*, and so the license boundary sits at the bin edge
# (#83 §4).
[[bin]]
name = "teams-server"
path = "src/main.rs"

[lib]

[dependencies]
teams-core     = { path = "../teams-core" }
teams-infra    = { path = "../teams-infra" }
teams-contract = { path = "../teams-contract" }
# The shapes a member's client also speaks (#148 decision 15). Same
# routes, same fields — which crate they live in is the answer to
# whether a client says them, and this binary answers both halves.
asterism-teams-wire = { path = "../asterism-teams-wire" }

# The forge is hosted on the team plane (#148 decision 20), so the
# transport that mirrors its verbs builds its services here, per
# request, over teams-infra's adapters. Same edge teams-infra already
# holds, and #83 §4 permits it outright.
asterism-core = { path = "../asterism-core" }

# The mirror carries the same DTOs below the prefix (#148 decision 19),
# and #148 revision 10 narrows §4's never-list to the modules its own
# reason covers: `asterism-contract::forge` is what this crate names
# and the only module of it that may be named here. `command`, `query`
# and `dto` stay on the never-list — there the stated reason ("the
# local app's plumbing; teams-infra owns its own") is the true one.
asterism-contract = { path = "../asterism-contract" }

anyhow     = { workspace = true }
axum       = { workspace = true }
clap       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
uuid       = { workspace = true }

# The blob upload reads its body frame by frame (`BodyExt::frame`) into
# the adapter's staging write — the no-full-body-buffering half of the
# #83 §3 write path. Promoted from dev-dependency when the blob routes
# landed (#93); the version is the same line the e2e suites pinned.
http-body-util = "0.1"
# `ReaderStream` for the blob read — the same adapter asterism-server's
# asset-file route streams originals through (see the workspace
# manifest's note on tokio-util): an open `tokio::fs::File` becomes the
# byte stream `Body::from_stream` takes, so a multi-GB blob never
# exists in memory at once.
tokio-util = { workspace = true }

[dev-dependencies]
# The member's client, for the #148 e2e — and only for it, which is why
# this line is here rather than above.
#
# It has to be this direction. #83 §4 forbids `asterism-* -> teams-*`
# in any form, so `asterism-teams-client` cannot take this crate even
# as a dev-dependency; the reverse is the permitted direction, and the
# client is on none of §4's never-list — that list is the local app's
# plumbing (`asterism-infra`, `-server`, and `-contract`'s command /
# query / dto), and a client built to talk to this server is the
# counterparty rather than the plumbing. Being a dev-dependency, it is
# not in the binary.
#
# What is deliberately **not** here: `asterism-infra`. The relation's
# SQLite adapter is tested where it lives; a fake behind the same port
# stands in for it in the e2e. That crate is the first name on §4's
# never-list and stays off this graph, dev or otherwise.
asterism-teams-client = { path = "../asterism-teams-client" }
async-trait           = { workspace = true }
chrono                = { workspace = true }

# The route e2e drives the real router through `oneshot` rather than
# binding a port — same discipline as asterism-server's suites. The
# #148 client e2e is the one exception and says why in its module doc:
# there the client is what is under test, and it speaks HTTP.
tower = { version = "0.5", features = ["util"] }
# The tests open the in-memory teams DB themselves and hold its driver,
# so the isle types appear in test signatures.
rusqlite-isle = { workspace = true }
# The blob e2e computes its declared digests the way a client would.
sha2 = { workspace = true }
# A throwaway blob root per test harness.
tempfile = "3"
# The backup restore e2e unpacks the archive the way an operator would.
tar = { workspace = true }
