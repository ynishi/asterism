[package]
name = "teams-server"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
repository.workspace = true
homepage.workspace   = true
description = "Hosted Team server for Asterism — its own binary, fully separate from asterism-server (#83 §4)"
# license deliberately undeclared until the teams-plane licensing decision (issue #83 §4)
# Not published to crates.io.
publish     = false

# Its own [[bin]], fully separate from the asterism-server binary: the
# only asterism-* crates in this binary are what asterism-core is and
# brings (its own deps ride along transitively), no asterism-* crate
# depends on any teams-*, and so the license boundary sits at the bin
# edge (#83 §4).
[[bin]]
name = "teams-server"
path = "src/main.rs"

[lib]

[dependencies]
teams-core     = { path = "../teams-core" }
teams-infra    = { path = "../teams-infra" }
teams-contract = { path = "../teams-contract" }

anyhow     = { workspace = true }
axum       = { workspace = true }
clap       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
uuid       = { workspace = true }

[dev-dependencies]
# The route e2e drives the real router through `oneshot` rather than
# binding a port — same discipline as asterism-server's suites.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# The tests open the in-memory teams DB themselves and hold its driver,
# so the isle types appear in test signatures.
rusqlite-isle = { workspace = true }
